# docker-compose.hot.yml - NexusTok 热重载开发环境
#
# 功能：
# - 前端：使用 Bun 监听文件变化并自动重新构建
# - 后端：使用 Go 热重载脚本自动编译和重启
# - 账号池：CLIProxyAPI 从源码热重载
# - 请求监控：CPA-Manager Usage Service 从源码运行并采集账号池使用量
# - 数据库：PostgreSQL + Redis
#
# 使用方法：
#   docker compose -f docker-compose.hot.yml up -d
#
# 访问地址：
#   - 后端 API: http://localhost:3003
#   - 前端开发: 文件修改后自动重新构建
#
# 环境变量：
#   HOT_PORT - 后端 API 端口（默认: 3003）
#   DOCKER_UID/DOCKER_GID - 容器内用户 ID

name: nexustok-hot

services:
  # 前端构建监听服务（自动检测文件变化并重新构建）
  frontend-watch:
    image: oven/bun:1
    container_name: nexustok-frontend-watch
    user: "${DOCKER_UID:-1002}:${DOCKER_GID:-1003}"
    working_dir: /app
    environment:
      BUN_INSTALL_CACHE_DIR: /app/.cache/bun
      DISABLE_ESLINT_PLUGIN: "true"
      HOME: /app/.cache/home
      NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
      NODE_ENV: production
      TMPDIR: /app/.cache/tmp
      npm_config_registry: https://registry.npmmirror.com
    volumes:
      - .:/app
    command: >
      sh -lc '
        set -eu
        mkdir -p /app/.cache/bun /app/.cache/home /app/.cache/tmp
        cd /app/web/default
        bun install --frozen-lockfile
        cd /app/web/classic
        bun install --frozen-lockfile
        cd /app/modules/cpa-manager
        bun install --frozen-lockfile
        cd /app
        (cd web/default && DISABLE_ESLINT_PLUGIN=true VITE_REACT_APP_VERSION=$$(cat /app/VERSION) bun run build -- --watch) &
        (cd web/classic && VITE_REACT_APP_VERSION=$$(cat /app/VERSION) bun run build -- --watch) &
        (cd modules/cpa-manager && VITE_NEXUSTOK_EMBEDDED=true bun run build -- --watch) &
        wait
      '
    restart: unless-stopped

  cliproxyapi:
    image: golang:1.26.1-alpine
    container_name: nexustok-account-pool-hot
    working_dir: /app
    command: ["/app/bin/docker-account-pool-sidecar.sh"]
    expose:
      - "8317"
    volumes:
      - .:/app
      - ./data:/data
      - hot_account_pool_gomodcache:/go/pkg/mod
      - hot_account_pool_gocache:/root/.cache/go-build
    environment:
      ACCOUNT_POOL_CLI_PROXY_DATA_DIR: /data/account-pool/cliproxyapi
      GOPROXY: https://goproxy.cn,https://goproxy.io,direct
      GOSUMDB: sum.golang.google.cn
      MANAGEMENT_PASSWORD: ${ACCOUNT_POOL_MANAGEMENT_KEY:-nexustok-account-pool-local}
      ACCOUNT_POOL_CLI_PROXY_RELAY_KEY: ${ACCOUNT_POOL_CLI_PROXY_RELAY_KEY:-nexustok-account-pool-relay-local}
      TZ: Asia/Shanghai
    networks:
      - hot-network
    restart: unless-stopped

  account-pool-usage:
    image: golang:1.26.1-alpine
    container_name: nexustok-account-pool-usage-hot
    working_dir: /app/modules/cpa-manager/usage-service
    command: ["go", "run", "./cmd/cpa-manager"]
    expose:
      - "18317"
    volumes:
      - .:/app
      - ./data:/data
      - hot_usage_gomodcache:/go/pkg/mod
      - hot_usage_gocache:/root/.cache/go-build
    environment:
      HTTP_ADDR: 0.0.0.0:18317
      USAGE_DATA_DIR: /data/account-pool/usage-service
      USAGE_DB_PATH: /data/account-pool/usage-service/usage.sqlite
      CPA_UPSTREAM_URL: http://cliproxyapi:8317
      CPA_MANAGEMENT_KEY: ${ACCOUNT_POOL_MANAGEMENT_KEY:-nexustok-account-pool-local}
      USAGE_COLLECTOR_MODE: auto
      USAGE_RESP_QUEUE: usage
      USAGE_RESP_POP_SIDE: right
      USAGE_BATCH_SIZE: "100"
      USAGE_POLL_INTERVAL_MS: "500"
      USAGE_QUERY_LIMIT: "50000"
      USAGE_CORS_ORIGINS: "*"
      GOPROXY: https://goproxy.cn,https://goproxy.io,direct
      GOSUMDB: sum.golang.google.cn
      TZ: Asia/Shanghai
    depends_on:
      cliproxyapi:
        condition: service_started
    networks:
      - hot-network
    restart: unless-stopped

  # NexusTok 后端服务（热重载模式）
  nexustok:
    build:
      context: .
      dockerfile: Dockerfile.dev-hot
    image: nexustok-api-hot:local
    container_name: nexustok-api-hot
    user: "${DOCKER_UID:-1002}:${DOCKER_GID:-1003}"
    working_dir: /app
    command: ["/app/bin/docker-hot-backend.sh"]
    ports:
      - "${HOT_PORT:-3003}:3000"
    volumes:
      - .:/app
      - ./data:/data
      - ./logs:/app/logs
    environment:
      SQL_DSN: postgresql://root:123456@postgres:5432/nexustok
      REDIS_CONN_STRING: redis://redis:6379
      TZ: Asia/Shanghai
      GIN_MODE: release
      GOPROXY: https://goproxy.cn,https://goproxy.io,direct
      GOSUMDB: sum.golang.google.cn
      DEBUG: "false"
      BATCH_UPDATE_ENABLED: "true"
      NODE_NAME: nexustok-hot-node-1
      SESSION_SECRET_FILE: /data/session_secret
      SESSION_MAX_AGE: "7776000"
      ACCOUNT_POOL_CLI_PROXY_URL: http://cliproxyapi:8317
      ACCOUNT_POOL_CLI_PROXY_MANAGEMENT_KEY: ${ACCOUNT_POOL_MANAGEMENT_KEY:-nexustok-account-pool-local}
      ACCOUNT_POOL_CLI_PROXY_RELAY_KEY: ${ACCOUNT_POOL_CLI_PROXY_RELAY_KEY:-nexustok-account-pool-relay-local}
      ACCOUNT_POOL_USAGE_SERVICE_URL: http://account-pool-usage:18317
      ACCOUNT_POOL_USAGE_SERVICE_MANAGEMENT_KEY: ${ACCOUNT_POOL_MANAGEMENT_KEY:-nexustok-account-pool-local}
    depends_on:
      frontend-watch:
        condition: service_started
      cliproxyapi:
        condition: service_started
      account-pool-usage:
        condition: service_started
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - hot-network
    restart: unless-stopped

  # Redis 缓存服务
  redis:
    image: redis:7-alpine
    container_name: nexustok-hot-redis
    restart: unless-stopped
    networks:
      - hot-network

  # PostgreSQL 数据库服务
  postgres:
    image: postgres:15-alpine
    container_name: nexustok-hot-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: nexustok
    volumes:
      - hot_pg_data:/var/lib/postgresql/data
    networks:
      - hot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d nexustok"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  hot_pg_data:
  hot_account_pool_gomodcache:
  hot_account_pool_gocache:
  hot_usage_gomodcache:
  hot_usage_gocache:

networks:
  hot-network:
    driver: bridge
