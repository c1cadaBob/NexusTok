# docker-compose.hot.yml - NexusTok 热重载开发环境
#
# 功能：
# - 前端：使用 Bun 监听文件变化并自动重新构建
# - 后端：使用 Go 热重载脚本自动编译和重启
# - 数据库：PostgreSQL + Redis
#
# 使用方法：
#   docker compose -f docker-compose.hot.yml up -d
#
# 访问地址：
#   - 后端 API: http://localhost:3003
#   - 前端开发: 文件修改后自动重新构建
#
# 环境变量：
#   HOT_PORT - 后端 API 端口（默认: 3003）
#   DOCKER_UID/DOCKER_GID - 容器内用户 ID（默认使用当前开发容器常见的 1000:1000）

name: nexustok-hot

services:
  # 前端构建监听服务（自动检测文件变化并重新构建）
  frontend-watch:
    image: oven/bun:1
    container_name: nexustok-frontend-watch
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    working_dir: /app
    environment:
      BUN_INSTALL_CACHE_DIR: /app/.cache/bun
      DISABLE_ESLINT_PLUGIN: "true"
      HOME: /app/.cache/home
      NEXUSTOK_HOT_RELOAD: "true"
      NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
      NODE_ENV: production
      TMPDIR: /app/.cache/tmp
      npm_config_registry: https://registry.npmmirror.com
    volumes:
      - .:/app
    command: >
      sh -lc '
        set -eu
        mkdir -p /app/.cache/bun /app/.cache/home /app/.cache/tmp
        ensure_deps() {
          project_dir="$$1"
          build_bin="$$2"
          cd "$$project_dir"
          if [ ! -x "node_modules/.bin/$$build_bin" ]; then
            echo "[hot] installing dependencies for $$project_dir"
            bun install --frozen-lockfile
          else
            echo "[hot] using existing dependencies for $$project_dir"
          fi
        }
        ensure_deps /app/web/default rsbuild
        ensure_deps /app/web/classic vite
        cd /app
        (cd web/default && DISABLE_ESLINT_PLUGIN=true VITE_REACT_APP_VERSION=$$(cat /app/VERSION) bun run build -- --watch) &
        (cd web/classic && VITE_REACT_APP_VERSION=$$(cat /app/VERSION) bun run build -- --watch) &
        wait
      '
    restart: unless-stopped

  # NexusTok 后端服务（热重载模式）
  nexustok:
    build:
      context: .
      dockerfile: Dockerfile.dev-hot
    image: nexustok-api-hot:local
    container_name: nexustok-api-hot
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    working_dir: /app
    command: ["/app/bin/docker-hot-backend.sh"]
    ports:
      - "${HOT_PORT:-3003}:3000"
    volumes:
      - .:/app
      - ./data:/data
      - ./logs:/app/logs
    environment:
      SQL_DSN: postgresql://root:123456@postgres:5432/nexustok
      REDIS_CONN_STRING: redis://redis:6379
      TZ: Asia/Shanghai
      GIN_MODE: release
      GOPROXY: https://goproxy.cn,https://goproxy.io,direct
      GOSUMDB: sum.golang.google.cn
      DEBUG: "false"
      BATCH_UPDATE_ENABLED: "true"
      NODE_NAME: nexustok-hot-node-1
      SESSION_SECRET_FILE: /data/session_secret
      SESSION_MAX_AGE: "7776000"
    depends_on:
      frontend-watch:
        condition: service_started
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - hot-network
    restart: unless-stopped

  # Redis 缓存服务
  redis:
    image: redis:7-alpine
    container_name: nexustok-hot-redis
    restart: unless-stopped
    networks:
      - hot-network

  # PostgreSQL 数据库服务
  postgres:
    image: postgres:15-alpine
    container_name: nexustok-hot-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: nexustok
    volumes:
      - hot_pg_data:/var/lib/postgresql/data
    networks:
      - hot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d nexustok"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  hot_pg_data:

networks:
  hot-network:
    driver: bridge
