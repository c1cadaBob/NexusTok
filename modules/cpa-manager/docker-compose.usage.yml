# docker-compose.usage.yml - CPA-Manager 使用量服务部署配置
#
# 功能：
# - 运行 CPA-Manager 使用量统计服务
# - 收集和查询 API 使用量数据
# - 支持健康检查
#
# 使用方法：
#   docker compose -f docker-compose.usage.yml up -d
#
# 环境变量：
#   HTTP_ADDR - 监听地址（默认: 0.0.0.0:18317）
#   USAGE_DB_PATH - SQLite 数据库路径（默认: /data/usage.sqlite）
#   USAGE_COLLECTOR_MODE - 采集模式（默认: auto）
#   USAGE_RESP_QUEUE - 响应队列名称（默认: usage）
#   USAGE_RESP_POP_SIDE - 队列弹出方向（默认: right）
#   USAGE_BATCH_SIZE - 批量处理大小（默认: 100）
#   USAGE_POLL_INTERVAL_MS - 轮询间隔毫秒（默认: 500）
#   USAGE_QUERY_LIMIT - 查询结果限制（默认: 50000）
#   USAGE_CORS_ORIGINS - CORS 允许来源（默认: *）
#
# 暴露端口：18317

services:
  cpa-manager:
    build:
      context: .
      dockerfile: Dockerfile.usage-service
    image: seakee/cpa-manager:latest
    restart: unless-stopped
    ports:
      - "18317:18317"
    environment:
      HTTP_ADDR: "0.0.0.0:18317"
      USAGE_DB_PATH: "/data/usage.sqlite"
      USAGE_COLLECTOR_MODE: "auto"
      USAGE_RESP_QUEUE: "usage"
      USAGE_RESP_POP_SIDE: "right"
      USAGE_BATCH_SIZE: "100"
      USAGE_POLL_INTERVAL_MS: "500"
      USAGE_QUERY_LIMIT: "50000"
      USAGE_CORS_ORIGINS: "*"
    volumes:
      - cpa-manager-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18317/health"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  cpa-manager-data:
