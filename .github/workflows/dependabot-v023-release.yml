name: v0.2.3 Dependabot 处理与发布

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "输入 RELEASE-V0.2.3 以继续"
        required: true
        type: string

permissions:
  contents: read

jobs:
  process-and-release:
    name: 处理 Dependabot 并发布 v0.2.3
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TOKEN }}
      GH_REPOSITORY: c1cadaBob/NexusTok
      RELEASE_TAG: v0.2.3
      RELEASE_COMMIT: ac0a1b8a929def9ff5ad165622356a1469dcc3e9
      DEPENDABOT_ALERT: "107"

    steps:
      - name: 检出主分支
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0

      - name: 校验发布确认
        env:
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_CONFIRMATION" != "RELEASE-V0.2.3" ]]; then
            echo "::error::发布确认文本不正确"
            exit 1
          fi

      - name: 读取并处理 Dependabot 警报
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::未配置 TOKEN 仓库 Secret"
            exit 1
          fi

          api_url="https://api.github.com/repos/${GH_REPOSITORY}"
          alert_file="$RUNNER_TEMP/dependabot-alert-${DEPENDABOT_ALERT}.json"
          open_alerts_file="$RUNNER_TEMP/dependabot-open-alerts.json"

          curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${api_url}/dependabot/alerts/${DEPENDABOT_ALERT}" \
            > "$alert_file"

          jq '{
            number,
            state,
            dependency: {
              ecosystem: .dependency.package.ecosystem,
              package: .dependency.package.name,
              manifest: .dependency.manifest_path,
              scope: .dependency.scope
            },
            advisory: {
              ghsa: .security_advisory.ghsa_id,
              cve: .security_advisory.cve_id,
              severity: .security_advisory.severity,
              summary: .security_advisory.summary
            },
            vulnerable_version_range: .security_vulnerability.vulnerable_version_range,
            first_patched_version: (.security_vulnerability.first_patched_version.identifier // null)
          }' "$alert_file"

          alert_state="$(jq -r '.state' "$alert_file")"
          if [[ "$alert_state" == "open" ]]; then
            package_name="$(jq -r '.dependency.package.name' "$alert_file")"
            first_patched_version="$(jq -r '.security_vulnerability.first_patched_version.identifier // empty' "$alert_file")"
            advisory_text="$(jq -r '[
              .security_advisory.summary,
              .security_advisory.description,
              .security_advisory.ghsa_id,
              .security_advisory.cve_id
            ] | map(select(type == "string")) | join("\n")' "$alert_file")"

            if [[ "$package_name" != "golang.org/x/crypto" ]]; then
              echo "::error::Dependabot #${DEPENDABOT_ALERT} 不属于预期的 golang.org/x/crypto 公告，停止发布"
              exit 1
            fi

            if [[ -n "$first_patched_version" ]]; then
              echo "::error::Dependabot #${DEPENDABOT_ALERT} 存在首个修复版本 ${first_patched_version}，必须先执行最小依赖升级"
              exit 1
            fi

            if ! grep -qi 'openpgp' <<< "$advisory_text"; then
              echo "::error::Dependabot #${DEPENDABOT_ALERT} 未确认涉及 openpgp，停止发布"
              exit 1
            fi

            if rg -n 'golang\.org/x/crypto/openpgp|(^|[^[:alnum:]_])openpgp([^[:alnum:]_]|$)' \
              --glob '*.go' .; then
              echo "::error::源码存在 openpgp 导入或调用，不能按 not_used 关闭"
              exit 1
            fi

            dismissal_file="$RUNNER_TEMP/dependabot-dismissal.json"
            jq -n \
              --arg comment "当前 NexusTok 代码仅使用 golang.org/x/crypto/argon2 和 golang.org/x/crypto/bcrypt，未导入或调用 golang.org/x/crypto/openpgp。govulncheck 未发现可达漏洞；该公告没有已知修复版本，因此按 not_used 关闭。" \
              '{
                state: "dismissed",
                dismissed_reason: "not_used",
                dismissed_comment: $comment
              }' > "$dismissal_file"

            curl --fail-with-body --silent --show-error \
              --request PATCH \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'Content-Type: application/json' \
              --data-binary "@${dismissal_file}" \
              "${api_url}/dependabot/alerts/${DEPENDABOT_ALERT}" \
              > "$RUNNER_TEMP/dependabot-dismissed.json"

            echo "Dependabot #${DEPENDABOT_ALERT} 已按 not_used 处理"
          elif [[ "$alert_state" != "dismissed" && "$alert_state" != "fixed" && "$alert_state" != "auto_dismissed" ]]; then
            echo "::error::Dependabot #${DEPENDABOT_ALERT} 状态为 ${alert_state}，停止发布"
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${api_url}/dependabot/alerts?state=open&per_page=100" \
            > "$open_alerts_file"

          jq 'map({
            number,
            state,
            package: .dependency.package.name,
            ecosystem: .dependency.package.ecosystem,
            manifest: .dependency.manifest_path,
            ghsa: .security_advisory.ghsa_id,
            cve: .security_advisory.cve_id,
            severity: .security_advisory.severity,
            first_patched_version: (.security_vulnerability.first_patched_version.identifier // null)
          })' "$open_alerts_file"

          open_count="$(jq 'length' "$open_alerts_file")"
          if [[ "$open_count" != "0" ]]; then
            echo "::error::仍存在 ${open_count} 条开放 Dependabot 警报，停止发布"
            exit 1
          fi

      - name: 创建 v0.2.3 标签
        run: |
          set -euo pipefail

          api_url="https://api.github.com/repos/${GH_REPOSITORY}"
          ref_file="$RUNNER_TEMP/v023-tag-ref.json"
          ref_status="$(curl --silent --show-error \
            -o "$ref_file" \
            -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${api_url}/git/ref/tags/${RELEASE_TAG}")"

          case "$ref_status" in
            404)
              ;;
            200)
              echo "::error::远端已存在 ${RELEASE_TAG} 标签，拒绝覆盖"
              exit 1
              ;;
            *)
              echo "::error::查询 ${RELEASE_TAG} 标签失败，HTTP ${ref_status}"
              exit 1
              ;;
          esac

          tag_payload="$RUNNER_TEMP/v023-tag-payload.json"
          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg message "发布 v0.2.3" \
            --arg object "$RELEASE_COMMIT" \
            '{tag: $tag, message: $message, object: $object, type: "commit"}' \
            > "$tag_payload"

          curl --fail-with-body --silent --show-error \
            --request POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data-binary "@${tag_payload}" \
            "${api_url}/git/tags" \
            > "$RUNNER_TEMP/v023-tag-object.json"

          tag_sha="$(jq -r '.sha' "$RUNNER_TEMP/v023-tag-object.json")"
          if [[ -z "$tag_sha" || "$tag_sha" == "null" ]]; then
            echo "::error::创建 ${RELEASE_TAG} 标签对象失败"
            exit 1
          fi

          ref_payload="$RUNNER_TEMP/v023-ref-payload.json"
          jq -n \
            --arg ref "refs/tags/${RELEASE_TAG}" \
            --arg sha "$tag_sha" \
            '{ref: $ref, sha: $sha}' \
            > "$ref_payload"

          curl --fail-with-body --silent --show-error \
            --request POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data-binary "@${ref_payload}" \
            "${api_url}/git/refs" \
            > "$RUNNER_TEMP/v023-created-ref.json"

          echo "${RELEASE_TAG} 已指向发布提交 ${RELEASE_COMMIT}"
