# release.yml - 跨平台二进制发布工作流
#
# 触发条件：
# - 推送标签（排除 *-alpha* 标签）
# - 手动触发
#
# 功能：
# - 为 Linux、macOS、Windows 三个平台构建二进制文件
# - 每个平台构建默认和经典两套前端
# - 生成 SHA256 校验和
# - 自动发布到 GitHub Releases
#
# 构建产物：
# - Linux: nexustok-{VERSION}（amd64）, nexustok-arm64-{VERSION}
# - macOS: nexustok-macos-{VERSION}
# - Windows: nexustok-{VERSION}.exe

name: Release (Linux, macOS, Windows)
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'reason'
        required: false
  push:
    tags:
      - '*'
      - '!*-alpha*'

jobs:
  linux:
    name: Linux Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Check runtime data is not packaged
        run: bash scripts/check-runtime-data-clean.sh
      - name: Check embedded model catalog size
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const manifest = JSON.parse(fs.readFileSync('modelcatalog/repository/manifest.json', 'utf8'))
          const count = Number(manifest.model_count || 0)
          if (count < 200) {
            console.error(`::error::Embedded model catalog has only ${count} models. Run: go run ./modelcatalog/cmd/catalogtool sync-models-dev -repo modelcatalog/repository`)
            process.exit(1)
          }
          console.log(`Embedded model catalog contains ${count} models.`)
          NODE
      - name: Determine Version
        run: |
          VERSION=$(git describe --tags)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Build Frontend (default)
        env:
          CI: ""
        run: |
          cd web/default
          bun install
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ../..
      - name: Build Frontend (classic)
        env:
          CI: ""
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd web/classic
          bun install
          VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ../..
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '>=1.25.1'
      - name: Build Backend (amd64)
        run: |
          go mod download
          go build -ldflags "-s -w -X 'github.com/c1cada/NexusTok/common.Version=$VERSION' -extldflags '-static'" -o nexustok-$VERSION
      - name: Build Backend (arm64)
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y gcc-aarch64-linux-gnu
          CC=aarch64-linux-gnu-gcc CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -ldflags "-s -w -X 'github.com/c1cada/NexusTok/common.Version=$VERSION' -extldflags '-static'" -o nexustok-arm64-$VERSION
      - name: Generate checksums
        run: sha256sum nexustok-* > checksums-linux.txt

      - name: Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            nexustok-*
            checksums-linux.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    name: macOS Release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Check runtime data is not packaged
        run: bash scripts/check-runtime-data-clean.sh
      - name: Check embedded model catalog size
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const manifest = JSON.parse(fs.readFileSync('modelcatalog/repository/manifest.json', 'utf8'))
          const count = Number(manifest.model_count || 0)
          if (count < 200) {
            console.error(`::error::Embedded model catalog has only ${count} models. Run: go run ./modelcatalog/cmd/catalogtool sync-models-dev -repo modelcatalog/repository`)
            process.exit(1)
          }
          console.log(`Embedded model catalog contains ${count} models.`)
          NODE
      - name: Determine Version
        run: |
          VERSION=$(git describe --tags)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Build Frontend (default)
        env:
          CI: ""
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd web/default
          bun install
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ../..
      - name: Build Frontend (classic)
        env:
          CI: ""
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd web/classic
          bun install
          VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ../..
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '>=1.25.1'
      - name: Build Backend
        run: |
          go mod download
          go build -ldflags "-X 'github.com/c1cada/NexusTok/common.Version=$VERSION'" -o nexustok-macos-$VERSION
      - name: Generate checksums
        run: shasum -a 256 nexustok-macos-* > checksums-macos.txt

      - name: Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            nexustok-macos-*
            checksums-macos.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Windows Release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Check runtime data is not packaged
        run: bash scripts/check-runtime-data-clean.sh
      - name: Check embedded model catalog size
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const manifest = JSON.parse(fs.readFileSync('modelcatalog/repository/manifest.json', 'utf8'))
          const count = Number(manifest.model_count || 0)
          if (count < 200) {
            console.error(`::error::Embedded model catalog has only ${count} models. Run: go run ./modelcatalog/cmd/catalogtool sync-models-dev -repo modelcatalog/repository`)
            process.exit(1)
          }
          console.log(`Embedded model catalog contains ${count} models.`)
          NODE
      - name: Determine Version
        run: |
          VERSION=$(git describe --tags)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Build Frontend (default)
        env:
          CI: ""
        run: |
          cd web/default
          bun install
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ../..
      - name: Build Frontend (classic)
        env:
          CI: ""
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd web/classic
          bun install
          VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ../..
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '>=1.25.1'
      - name: Build Backend
        run: |
          go mod download
          go build -ldflags "-s -w -X 'github.com/c1cada/NexusTok/common.Version=$VERSION'" -o nexustok-$VERSION.exe
      - name: Generate checksums
        run: sha256sum nexustok-*.exe > checksums-windows.txt

      - name: Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            nexustok-*.exe
            checksums-windows.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
