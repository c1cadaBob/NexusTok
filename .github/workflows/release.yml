name: Release (Linux, macOS, Windows)
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'reason'
        required: false
  push:
    tags:
      - '*'
      - '!*-alpha*'

jobs:
  linux:
    name: Linux Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Determine Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=$(git describe --tags --match 'v[0-9]*')
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Build Frontend
        env:
          CI: ""
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ..
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.6'
      - name: Build Backend (amd64)
        run: |
          go mod download
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X 'github.com/c1cadaBob/NexusTok/common.Version=$VERSION' -extldflags '-static'" -o nexustok-linux-amd64-$VERSION
      - name: Build Backend (arm64)
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y gcc-aarch64-linux-gnu
          CC=aarch64-linux-gnu-gcc CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -ldflags "-s -w -X 'github.com/c1cadaBob/NexusTok/common.Version=$VERSION' -extldflags '-static'" -o nexustok-linux-arm64-$VERSION
      - name: Generate checksums
        run: sha256sum "nexustok-linux-amd64-$VERSION" "nexustok-linux-arm64-$VERSION" > "checksums-linux-$VERSION.txt"
      - name: Resolve release notes
        id: release_notes
        run: |
          RELEASE_NOTES=".github/release-notes/$VERSION.md"
          if [ ! -f "$RELEASE_NOTES" ]; then
            RELEASE_NOTES="$RUNNER_TEMP/release-notes-$VERSION.md"
            {
              echo "# NexusTok $VERSION"
              echo
              echo "本版本由自动发布流程生成。"
              echo
              echo "## 完整变更"
              echo
              echo "https://github.com/c1cadaBob/NexusTok/releases/tag/$VERSION"
            } > "$RELEASE_NOTES"
          fi
          echo "path=$RELEASE_NOTES" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ env.VERSION }}
          body_path: ${{ steps.release_notes.outputs.path }}
          make_latest: true
          files: |
            nexustok-linux-*
            checksums-linux-*.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    name: macOS Release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Determine Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=$(git describe --tags --match 'v[0-9]*')
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Build Frontend
        env:
          CI: ""
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ..
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.6'
      - name: Build Backend
        run: |
          go mod download
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags "-X 'github.com/c1cadaBob/NexusTok/common.Version=$VERSION'" -o nexustok-darwin-amd64-$VERSION
      - name: Generate checksums
        run: shasum -a 256 "nexustok-darwin-amd64-$VERSION" > "checksums-darwin-$VERSION.txt"
      - name: Resolve release notes
        id: release_notes
        run: |
          RELEASE_NOTES=".github/release-notes/$VERSION.md"
          if [ ! -f "$RELEASE_NOTES" ]; then
            RELEASE_NOTES="$RUNNER_TEMP/release-notes-$VERSION.md"
            {
              echo "# NexusTok $VERSION"
              echo
              echo "本版本由自动发布流程生成。"
              echo
              echo "## 完整变更"
              echo
              echo "https://github.com/c1cadaBob/NexusTok/releases/tag/$VERSION"
            } > "$RELEASE_NOTES"
          fi
          echo "path=$RELEASE_NOTES" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ env.VERSION }}
          body_path: ${{ steps.release_notes.outputs.path }}
          make_latest: true
          files: |
            nexustok-darwin-*
            checksums-darwin-*.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Windows Release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Determine Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=$(git describe --tags --match 'v[0-9]*')
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Build Frontend
        env:
          CI: ""
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ..
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.6'
      - name: Build Backend
        run: |
          go mod download
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "-s -w -X 'github.com/c1cadaBob/NexusTok/common.Version=$VERSION'" -o nexustok-windows-amd64-$VERSION.exe
      - name: Generate checksums
        run: sha256sum "nexustok-windows-amd64-$VERSION.exe" > "checksums-windows-$VERSION.txt"
      - name: Resolve release notes
        id: release_notes
        run: |
          RELEASE_NOTES=".github/release-notes/$VERSION.md"
          if [ ! -f "$RELEASE_NOTES" ]; then
            RELEASE_NOTES="$RUNNER_TEMP/release-notes-$VERSION.md"
            {
              echo "# NexusTok $VERSION"
              echo
              echo "本版本由自动发布流程生成。"
              echo
              echo "## 完整变更"
              echo
              echo "https://github.com/c1cadaBob/NexusTok/releases/tag/$VERSION"
            } > "$RELEASE_NOTES"
          fi
          echo "path=$RELEASE_NOTES" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ env.VERSION }}
          body_path: ${{ steps.release_notes.outputs.path }}
          make_latest: true
          files: |
            nexustok-windows-*.exe
            checksums-windows-*.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
