# release.yml - 跨平台二进制发布工作流
#
# 触发条件：
# - 推送标签（排除 *-alpha* 标签）
# - 手动触发
#
# 功能：
# - 为 Linux、macOS、Windows 三个平台构建二进制文件
# - 每个平台构建默认和经典两套前端
# - 生成 SHA256 校验和
# - 自动发布到 GitHub Releases
#
# 构建产物：
# - Linux: nexustok-linux-amd64-{VERSION}, nexustok-linux-arm64-{VERSION}
# - macOS: nexustok-darwin-amd64-{VERSION}
# - Windows: nexustok-windows-amd64-{VERSION}.exe
# - 校验和：checksums-{platform}-{VERSION}.txt

name: Release (Linux, macOS, Windows)
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'reason'
        required: false
  push:
    tags:
      - '*'
      - '!*-alpha*'

jobs:
  linux:
    name: Linux Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Check runtime data is not packaged
        run: bash scripts/check-runtime-data-clean.sh
      - name: Check embedded model catalog size
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const manifest = JSON.parse(fs.readFileSync('modelcatalog/repository/manifest.json', 'utf8'))
          const count = Number(manifest.model_count || 0)
          if (count < 200) {
            console.error(`::error::Embedded model catalog has only ${count} models. Run: go run ./modelcatalog/cmd/catalogtool sync-models-dev -repo modelcatalog/repository`)
            process.exit(1)
          }
          console.log(`Embedded model catalog contains ${count} models.`)
          NODE
      - name: Determine Version
        run: |
          VERSION=$(git describe --tags)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Build Frontend (default)
        env:
          CI: ""
        run: |
          cd web/default
          bun install
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ../..
      - name: Build Frontend (classic)
        env:
          CI: ""
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd web/classic
          bun install
          VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ../..
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '>=1.25.1'
      - name: Build Backend (amd64)
        run: |
          go mod download
          go build -ldflags "-s -w -X 'github.com/c1cada/NexusTok/common.Version=$VERSION' -extldflags '-static'" -o nexustok-linux-amd64-$VERSION
      - name: Build Backend (arm64)
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y gcc-aarch64-linux-gnu
          CC=aarch64-linux-gnu-gcc CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -ldflags "-s -w -X 'github.com/c1cada/NexusTok/common.Version=$VERSION' -extldflags '-static'" -o nexustok-linux-arm64-$VERSION
      - name: Generate checksums
        run: sha256sum "nexustok-linux-amd64-$VERSION" "nexustok-linux-arm64-$VERSION" > "checksums-linux-$VERSION.txt"
      - name: Resolve release notes
        id: release_notes
        run: |
          RELEASE_NOTES=".github/release-notes/$VERSION.md"
          if [ ! -f "$RELEASE_NOTES" ]; then
            RELEASE_NOTES="$RUNNER_TEMP/release-notes-$VERSION.md"
            {
              echo "# NexusTok $VERSION"
              echo
              echo "本版本由自动发布流程生成。"
              echo
              echo "## 完整变更"
              echo
              echo "https://github.com/c1cadaBob/NexusTok/releases/tag/$VERSION"
            } > "$RELEASE_NOTES"
          fi
          echo "path=$RELEASE_NOTES" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ env.VERSION }}
          body_path: ${{ steps.release_notes.outputs.path }}
          make_latest: true
          files: |
            nexustok-linux-*
            checksums-linux-*.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    name: macOS Release
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Check runtime data is not packaged
        run: bash scripts/check-runtime-data-clean.sh
      - name: Check embedded model catalog size
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const manifest = JSON.parse(fs.readFileSync('modelcatalog/repository/manifest.json', 'utf8'))
          const count = Number(manifest.model_count || 0)
          if (count < 200) {
            console.error(`::error::Embedded model catalog has only ${count} models. Run: go run ./modelcatalog/cmd/catalogtool sync-models-dev -repo modelcatalog/repository`)
            process.exit(1)
          }
          console.log(`Embedded model catalog contains ${count} models.`)
          NODE
      - name: Determine Version
        run: |
          VERSION=$(git describe --tags)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Build Frontend (default)
        env:
          CI: ""
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd web/default
          bun install
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ../..
      - name: Build Frontend (classic)
        env:
          CI: ""
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd web/classic
          bun install
          VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ../..
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '>=1.25.1'
      - name: Build Backend
        run: |
          go mod download
          GOOS=darwin GOARCH=amd64 go build -ldflags "-X 'github.com/c1cada/NexusTok/common.Version=$VERSION'" -o nexustok-darwin-amd64-$VERSION
      - name: Generate checksums
        run: shasum -a 256 "nexustok-darwin-amd64-$VERSION" > "checksums-darwin-$VERSION.txt"
      - name: Resolve release notes
        id: release_notes
        run: |
          RELEASE_NOTES=".github/release-notes/$VERSION.md"
          if [ ! -f "$RELEASE_NOTES" ]; then
            RELEASE_NOTES="$RUNNER_TEMP/release-notes-$VERSION.md"
            {
              echo "# NexusTok $VERSION"
              echo
              echo "本版本由自动发布流程生成。"
              echo
              echo "## 完整变更"
              echo
              echo "https://github.com/c1cadaBob/NexusTok/releases/tag/$VERSION"
            } > "$RELEASE_NOTES"
          fi
          echo "path=$RELEASE_NOTES" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ env.VERSION }}
          body_path: ${{ steps.release_notes.outputs.path }}
          make_latest: true
          files: |
            nexustok-darwin-*
            checksums-darwin-*.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Windows Release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Check runtime data is not packaged
        run: bash scripts/check-runtime-data-clean.sh
      - name: Check embedded model catalog size
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const manifest = JSON.parse(fs.readFileSync('modelcatalog/repository/manifest.json', 'utf8'))
          const count = Number(manifest.model_count || 0)
          if (count < 200) {
            console.error(`::error::Embedded model catalog has only ${count} models. Run: go run ./modelcatalog/cmd/catalogtool sync-models-dev -repo modelcatalog/repository`)
            process.exit(1)
          }
          console.log(`Embedded model catalog contains ${count} models.`)
          NODE
      - name: Determine Version
        run: |
          VERSION=$(git describe --tags)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Build Frontend (default)
        env:
          CI: ""
        run: |
          cd web/default
          bun install
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ../..
      - name: Build Frontend (classic)
        env:
          CI: ""
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd web/classic
          bun install
          VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ../..
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '>=1.25.1'
      - name: Build Backend
        run: |
          go mod download
          go build -ldflags "-s -w -X 'github.com/c1cada/NexusTok/common.Version=$VERSION'" -o nexustok-windows-amd64-$VERSION.exe
      - name: Generate checksums
        run: sha256sum "nexustok-windows-amd64-$VERSION.exe" > "checksums-windows-$VERSION.txt"
      - name: Resolve release notes
        id: release_notes
        run: |
          RELEASE_NOTES=".github/release-notes/$VERSION.md"
          if [ ! -f "$RELEASE_NOTES" ]; then
