# ci-cd.yml - 主 CI/CD 流水线
#
# 触发条件：
# - PR 到 main：仅执行后端测试和前端构建检查
# - 推送到 main：检查通过后发布 Docker latest/main/版本化镜像
# - 推送标签：检查通过后发布对应标签镜像，稳定版本标签同步 latest
# - 手动触发：检查通过后发布 manual-* 镜像
#
# Docker Hub 凭据：
# - DOCKER_USERNAME：Docker Hub 用户名
# - DOCKER_PASSWORD：Docker Hub access token 或密码

name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Prepare embedded frontend placeholders
        run: |
          # main.go 使用 go:embed 引用前端 dist；后端测试不依赖真实前端产物，
          # 这里只创建最小文件，保证干净 checkout 下根包可以被 Go 正常加载。
          mkdir -p web/default/dist web/classic/dist
          printf '<!doctype html><html lang="en"></html>\n' > web/default/dist/index.html
          printf '<!doctype html><html lang="en"></html>\n' > web/classic/dist/index.html

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Run Go tests
        run: go test ./...

  frontend-build:
    name: Frontend builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build default frontend
        env:
          CI: ""
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd web/default
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=ci bun run build:check

      - name: Build classic frontend
        env:
          CI: ""
        run: |
          cd web/classic
          bun install --frozen-lockfile
          VITE_REACT_APP_VERSION=ci bun run build

  prepare_docker:
    name: Prepare Docker tags
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
      version: ${{ steps.tags.outputs.version }}
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve Docker tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          SHORT_SHA=$(git rev-parse --short HEAD)

          # Dockerfile 会读取 VERSION，因此这里生成的版本必须和最终镜像 tag 保持一致。
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="manual-$(date +'%Y%m%d')-${SHORT_SHA}"
            DOCKER_TAGS=("${VERSION}")
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
            if [[ ! "${VERSION}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::Git tag '${VERSION}' cannot be used as a Docker tag"
              exit 1
            fi

            DOCKER_TAGS=("${VERSION}")
            if [[ "${VERSION}" =~ ^v?[0-9]+([.][0-9]+){1,2}$ ]]; then
              DOCKER_TAGS+=("latest")
            fi
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            VERSION="main-$(date +'%Y%m%d')-${SHORT_SHA}"
            DOCKER_TAGS=("latest" "main" "${VERSION}")
          else
            echo "::error::Unsupported ref '${GITHUB_REF_NAME}' for Docker publishing"
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          {
            echo "tags<<EOF"
            printf '%s\n' "${DOCKER_TAGS[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          echo "Prepared Docker version: ${VERSION}"
          printf 'Prepared Docker tags: %s\n' "${DOCKER_TAGS[*]}"

  docker-build:
    name: Build & push Docker (${{ matrix.arch }})
    needs:
      - backend-test
      - frontend-build
      - prepare_docker
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/nexustok
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Write VERSION
        run: |
          echo "${{ needs.prepare_docker.outputs.version }}" > VERSION
          echo "Publishing version: ${{ needs.prepare_docker.outputs.version }} for ${{ matrix.arch }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Build Docker tag list
        id: docker_tags
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          TAGS: ${{ needs.prepare_docker.outputs.tags }}
        run: |
          set -euo pipefail

          {
            echo "tags<<EOF"
            while IFS= read -r tag; do
              [ -z "${tag}" ] && continue
              echo "${IMAGE_NAME}:${tag}-${ARCH}"
            done <<< "${TAGS}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.docker_tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "### Docker Image Tags (${{ matrix.arch }})" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          echo "${{ steps.docker_tags.outputs.tags }}" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"

  docker-manifest:
    name: Create Docker manifests
    needs:
      - prepare_docker
      - docker-build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/nexustok
      TAGS: ${{ needs.prepare_docker.outputs.tags }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create and push Docker manifests
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r tag; do
            [ -z "${tag}" ] && continue
            docker buildx imagetools create \
              -t "${IMAGE_NAME}:${tag}" \
              "${IMAGE_NAME}:${tag}-amd64" \
              "${IMAGE_NAME}:${tag}-arm64"
          done <<< "${TAGS}"

      - name: Manifest summary
        shell: bash
        run: |
          set -euo pipefail

          echo "### Docker Manifests" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          while IFS= read -r tag; do
            [ -z "${tag}" ] && continue
            docker buildx imagetools inspect "${IMAGE_NAME}:${tag}" >> "${GITHUB_STEP_SUMMARY}"
            echo "---" >> "${GITHUB_STEP_SUMMARY}"
          done <<< "${TAGS}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
