# electron-build.yml - Electron 桌面应用构建和发布
#
# 触发条件：
# - 推送正式版本标签（排除预发布标签 *-*、*-alpha*）
# - 手动触发
#
# 功能：
# - 构建前端和 Go 后端二进制
# - 打包为 Electron 桌面应用（目前仅支持 Windows）
# - 上传构建产物到 GitHub Releases
#
# 构建产物：
# - Windows: nexustok-desktop-windows-amd64-setup-{VERSION}.exe
# - Windows: nexustok-desktop-windows-amd64-portable-{VERSION}.exe
# - 校验和：checksums-desktop-windows-{VERSION}.txt

name: Build Electron App

on:
  push:
    tags:
      - '*'  # Triggers on version tags like v1.0.0
      - '!*-*'  # Ignore pre-release tags like v1.0.0-beta
      - '!*-alpha*' # Ignore alpha tags like v1.0.0-alpha
  workflow_dispatch:  # Allows manual triggering

jobs:
  build:
    strategy:
      matrix:
        # os: [macos-latest, windows-latest]
        os: [windows-latest]

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Build default frontend
        env:
          CI: ""
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd web/default
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$(git describe --tags) bun run build
          cd ../..

      - name: Build classic frontend
        env:
          CI: ""
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd web/classic
          bun install --frozen-lockfile
          VITE_REACT_APP_VERSION=$(git describe --tags) bun run build
          cd ../..

      # - name: Build Go binary (macos/Linux)
      #   if: runner.os != 'Windows'
      #   run: |
      #     go mod download
      #     go build -ldflags "-s -w -X 'github.com/c1cada/NexusTok/common.Version=$(git describe --tags)' -extldflags '-static'" -o nexustok

      - name: Build Go binary (Windows)
        if: runner.os == 'Windows'
        run: |
          go mod download
          go build -ldflags "-s -w -X 'github.com/c1cada/NexusTok/common.Version=$(git describe --tags)'" -o nexustok.exe

      - name: Update Electron version
        run: |
          cd electron
          VERSION=$(git describe --tags)
          VERSION=${VERSION#v}  # Remove 'v' prefix if present
          # Convert to valid semver: take first 3 components and convert rest to prerelease format
          # e.g., 0.9.3-patch.1 -> 0.9.3-patch.1
          if [[ $VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(.*)$ ]]; then
            MAJOR=${BASH_REMATCH[1]}
            MINOR=${BASH_REMATCH[2]}
            PATCH=${BASH_REMATCH[3]}
            REST=${BASH_REMATCH[4]}
          
            VERSION="$MAJOR.$MINOR.$PATCH"
          
            # If there's extra content, append it without adding -dev
            if [[ -n "$REST" ]]; then
              VERSION="$VERSION$REST"
            fi
          fi
          npm version $VERSION --no-git-tag-version --allow-same-version

      - name: Install Electron dependencies
        run: |
          cd electron
          npm ci

      # - name: Build Electron app (macOS)
      #   if: runner.os == 'macOS'
      #   run: |
      #     cd electron
      #     npm run build:mac
      #   env:
      #     CSC_IDENTITY_AUTO_DISCOVERY: false  # Skip code signing

      - name: Build Electron app (Windows)
        if: runner.os == 'Windows'
        run: |
          cd electron
          npm run build:win

      - name: Normalize Windows release assets
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail

          VERSION=$(git describe --tags)
          mkdir -p release-assets

          SETUP_FILE=$(find electron/dist -maxdepth 1 -type f -iname '*Setup*.exe' -print -quit)
          PORTABLE_FILE=$(find electron/dist -maxdepth 1 -type f -iname '*.exe' ! -iname '*Setup*.exe' -print -quit)

          if [ -z "$SETUP_FILE" ]; then
            echo "::error::Electron setup executable was not found in electron/dist"
            exit 1
          fi

          if [ -z "$PORTABLE_FILE" ]; then
            echo "::error::Electron portable executable was not found in electron/dist"
            exit 1
          fi

          cp "$SETUP_FILE" "release-assets/nexustok-desktop-windows-amd64-setup-$VERSION.exe"
          cp "$PORTABLE_FILE" "release-assets/nexustok-desktop-windows-amd64-portable-$VERSION.exe"
          sha256sum release-assets/*.exe > "release-assets/checksums-desktop-windows-$VERSION.txt"

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-build
          path: |
            release-assets/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Resolve release notes
        id: release_notes
        run: |
          VERSION="${GITHUB_REF_NAME}"
          RELEASE_NOTES=".github/release-notes/$VERSION.md"
          if [ ! -f "$RELEASE_NOTES" ]; then
            RELEASE_NOTES="$RUNNER_TEMP/release-notes-$VERSION.md"
            {
              echo "# NexusTok $VERSION"
              echo
              echo "本版本由自动发布流程生成。"
              echo
              echo "## 完整变更"
              echo
              echo "https://github.com/c1cadaBob/NexusTok/releases/tag/$VERSION"
            } > "$RELEASE_NOTES"
          fi
          echo "path=$RELEASE_NOTES" >> "$GITHUB_OUTPUT"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.release_notes.outputs.path }}
          make_latest: true
          files: |
            windows-desktop-build/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
