# NexusTok 生产 Docker Compose 配置
#
# 快速启动：
#   1. bash scripts/deploy.sh
#   2. 访问 http://localhost:3030
#
# scripts/deploy.sh 首次运行会在当前目录生成权限为 0600 的 .env，
# 写入随机的 POSTGRES_PASSWORD 和 REDIS_PASSWORD。也可以提前自行创建 .env。
#
# 使用 MySQL 替代 PostgreSQL：
#   1. 注释 postgres 服务和 SQL_DSN 行
#   2. 取消 mysql 服务和 MySQL SQL_DSN 行的注释
#   3. 在 depends_on 中取消 mysql 注释
#   4. 在 volumes 中取消 mysql_data 注释
#
# 高并发日志拆分：
#   1. 取消 LOG_SQL_DSN=clickhouse://... 行的注释
#   2. 在 depends_on 中取消 clickhouse 注释
#   3. 取消 clickhouse 服务和 clickhouse_data 卷的注释
#
# 系统维护页面内 Docker 自动更新：
#   - 默认挂载 /var/run/docker.sock，让 Root 管理员可以在后台拉取镜像并重建当前容器
#   - Docker socket 等同宿主机 Docker 管理权限，只应部署在可信管理员可访问的实例中
#
# 重要：生产环境必须先备份数据；SQLite 不会自动迁移到 PostgreSQL。

services:
  nexustok:
    image: c1cadabob/nexustok:latest
    container_name: nexustok
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3030:3030"
    volumes:
      - /opt/nexustok/data:/data
      - /opt/nexustok/logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock # 系统维护 Docker 自动更新需要；等同宿主高权限入口
    environment:
      SQL_DSN: "postgresql://root:${POSTGRES_PASSWORD:?请先在 .env 中设置 POSTGRES_PASSWORD}@postgres:5432/nexustok"
      REDIS_CONN_STRING: "redis://:${REDIS_PASSWORD:?请先在 .env 中设置 REDIS_PASSWORD}@redis:6379/0"
      REDIS_POOL_SIZE: "256"
      SQL_MAX_IDLE_CONNS: "100"
      SQL_MAX_OPEN_CONNS: "1000"
      SQL_MAX_LIFETIME: "60"
      TZ: Asia/Shanghai
      PORT: "3030"
      ERROR_LOG_ENABLED: "true"
      BATCH_UPDATE_ENABLED: "true"
      NODE_NAME: nexustok-node-1
      SESSION_SECRET_FILE: /data/session_secret
      SESSION_MAX_AGE: "7776000"
#      SQL_DSN: root:password@tcp(mysql:3306)/nexustok  # 使用 MySQL 时替换 PostgreSQL 配置
#      LOG_SQL_DSN: clickhouse://default:password@clickhouse:9000/nexustok_logs # 可选的 ClickHouse 日志库
#      LOG_SQL_CLICKHOUSE_TTL_DAYS: "30" # 可选的 ClickHouse 日志保留天数；0 表示关闭 TTL
#      STREAMING_TIMEOUT: "300"
#      RELAY_MAX_IDLE_CONNS: "1000"
#      RELAY_MAX_IDLE_CONNS_PER_HOST: "200"
#      RELAY_MAX_CONNS_PER_HOST: "0"
#      RELAY_RESPONSE_HEADER_TIMEOUT: "300"
#      RELAY_PROXY_CLIENT_CACHE_TTL: "900"
#      RELAY_PROXY_CLIENT_CACHE_MAX_SIZE: "4096"
#      SESSION_SECRET: random_string  # 多机部署时设置；单容器默认从 SESSION_SECRET_FILE 读取
#      SYNC_FREQUENCY: "60"
#      GOOGLE_ANALYTICS_ID: G-XXXXXXXXXX
#      UMAMI_WEBSITE_ID: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
#      UMAMI_SCRIPT_URL: https://analytics.umami.is/script.js
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
#      mysql:  # 使用 MySQL 时替换 postgres 依赖
#        condition: service_healthy
#      clickhouse:  # 使用 ClickHouse 日志库时取消注释
#        condition: service_healthy
    networks:
      - nexustok-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3030/api/status | grep -q '\"success\":[[:space:]]*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?请先在 .env 中设置 REDIS_PASSWORD}"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?请先在 .env 中设置 REDIS_PASSWORD}"]
    networks:
      - nexustok-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?请先在 .env 中设置 POSTGRES_PASSWORD}"
      POSTGRES_DB: nexustok
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - nexustok-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d nexustok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
