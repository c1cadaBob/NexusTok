# NexusTok Docker Compose 配置
#
# 快速启动：
#   1. docker-compose up -d
#   2. 访问 http://localhost:3000
#
# 使用 MySQL 替代 PostgreSQL：
#   1. 注释 postgres 服务和 SQL_DSN 行
#   2. 取消 mysql 服务和 MySQL SQL_DSN 行的注释
#   3. 在 depends_on 中取消 mysql 注释
#   4. 在 volumes 中取消 mysql_data 注释
#
# 高并发日志拆分：
#   1. 取消 LOG_SQL_DSN=clickhouse://... 行的注释
#   2. 在 depends_on 中取消 clickhouse 注释
#   3. 取消 clickhouse 服务和 clickhouse_data 卷的注释
#
# 系统维护页面内 Docker 自动更新：
#   - 默认挂载 /var/run/docker.sock，让 Root 管理员可以在后台拉取镜像并重建当前容器
#   - Docker socket 等同宿主机 Docker 管理权限，只应部署在可信管理员可访问的实例中
#
# ⚠️  重要：生产环境部署前必须修改所有默认密码和会话密钥！

version: '3.4' # For compatibility with older Docker versions

services:
  nexustok:
    image: c1cadabob/nexustok:latest
    container_name: nexustok
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock # 系统维护 Docker 自动更新需要；等同宿主高权限入口
    environment:
      - SQL_DSN=postgresql://root:123456@postgres:5432/nexustok # ⚠️ IMPORTANT: Change the password in production!
#      - SQL_DSN=root:123456@tcp(mysql:3306)/nexustok  # Point to the mysql service, uncomment if using MySQL
#      - LOG_SQL_DSN=clickhouse://default:123456@clickhouse:9000/nexustok_logs # OPTIONAL: high-concurrency consume logs only
#      - LOG_SQL_CLICKHOUSE_TTL_DAYS=30 # OPTIONAL: ClickHouse log retention days; 0 disables TTL
      - REDIS_CONN_STRING=redis://:123456@redis:6379 # ⚠️ IMPORTANT: Change the password in production!
      - REDIS_POOL_SIZE=256 # 多节点/高并发建议从 128/256 起步压测
      - SQL_MAX_IDLE_CONNS=100
      - SQL_MAX_OPEN_CONNS=1000
      - SQL_MAX_LIFETIME=60
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true # 是否启用错误日志记录 (Whether to enable error log recording)
      - BATCH_UPDATE_ENABLED=true  # 是否启用批量更新 (Whether to enable batch update)
      - NODE_NAME=nexustok-node-1  # 节点名称，用于审计日志中标识节点身份；多节点/容器部署时建议设置 (Node name used in audit logs; recommended when running multiple instances or in containers)
      - SESSION_SECRET_FILE=/data/session_secret
      - SESSION_MAX_AGE=7776000 # 默认 90 天；多节点部署仍建议显式设置 SESSION_SECRET
#      - STREAMING_TIMEOUT=300  # 流模式无响应超时时间，单位秒，默认120秒，如果出现空补全可以尝试改为更大值 （Streaming timeout in seconds, default is 120s. Increase if experiencing empty completions）
#      - RELAY_MAX_IDLE_CONNS=1000
#      - RELAY_MAX_IDLE_CONNS_PER_HOST=200
#      - RELAY_MAX_CONNS_PER_HOST=0 # 0 表示不限制；需要保护代理或上游连接数时设置为明确上限
#      - RELAY_RESPONSE_HEADER_TIMEOUT=300 # 等待上游响应头超时；流式请求已经开始后不受此项限制
#      - RELAY_PROXY_CLIENT_CACHE_TTL=900
#      - RELAY_PROXY_CLIENT_CACHE_MAX_SIZE=4096
#      - SESSION_SECRET=random_string  # 多机部署时设置，必须修改这个随机字符串！！ （multi-node deployment, set this to a random string!!!!!!!）
#      - SYNC_FREQUENCY=60  # Uncomment if regular database syncing is needed
#      - GOOGLE_ANALYTICS_ID=G-XXXXXXXXXX  # Google Analytics 的测量 ID (Google Analytics Measurement ID)
#      - UMAMI_WEBSITE_ID=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx  # Umami 网站 ID (Umami Website ID)
#      - UMAMI_SCRIPT_URL=https://analytics.umami.is/script.js  # Umami 脚本 URL，默认为官方地址 (Umami Script URL, defaults to official URL)

    depends_on:
      - redis
      - postgres
#      - mysql  # Uncomment if using MySQL
#      - clickhouse  # Uncomment if using ClickHouse for LOG_SQL_DSN
    networks:
      - nexustok-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "123456"]  # ⚠️ IMPORTANT: Change this password in production!
    networks:
      - nexustok-network

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456  # ⚠️ IMPORTANT: Change this password in production!
      POSTGRES_DB: nexustok
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - nexustok-network
#    ports:
#      - "5432:5432"  # Uncomment if you need to access PostgreSQL from outside Docker

