#    networks:
#      - nexustok-network
#    ports:
#      - "8123:8123"  # HTTP interface, uncomment if you need external access
#      - "9000:9000"  # Native interface used by LOG_SQL_DSN above

volumes:
  pg_data:
#  mysql_data:
