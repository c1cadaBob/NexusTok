# docker-compose.dev.yml - NexusTok 前端开发环境
#
# 功能：
# - 从本地源码构建后端（Dockerfile.dev）
# - 前端使用独立的开发服务器（bun run dev）
# - 自动代理 API 请求到后端
#
# 使用方法：
#   1. docker compose -f docker-compose.dev.yml up -d
#   2. cd web && bun install && bun run dev
#   3. 访问 http://localhost:3001（Rsbuild 开发服务器，API 自动代理到 :3000）
#
# 重新构建后端（Go 代码修改后）：
#   docker compose -f docker-compose.dev.yml up -d --build nexustok
#
# 停止服务：
#   docker compose -f docker-compose.dev.yml down
#
# 重置数据：
#   docker compose -f docker-compose.dev.yml down -v

services:
  # NexusTok 后端服务（从本地源码构建）
  nexustok:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: nexustok-dev:local
    container_name: nexustok-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - dev_data:/data
    environment:
      - SQL_DSN=postgresql://root:123456@postgres:5432/nexustok
      - REDIS_CONN_STRING=redis://redis
      - TZ=Asia/Shanghai
      - BATCH_UPDATE_ENABLED=true
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - dev-network

  redis:
    image: redis:7-alpine
    container_name: nexustok-dev-redis
    restart: unless-stopped
    networks:
      - dev-network

  # PostgreSQL 数据库服务
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: nexustok
    volumes:
      - dev_pg_data:/var/lib/postgresql/data
    networks:
      - dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d nexustok"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  dev_data:
  dev_pg_data:

networks:
  dev-network:
    driver: bridge
